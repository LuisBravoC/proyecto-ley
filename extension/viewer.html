<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista Casa Ley compartida</title>
<style>
  body{font-family:system-ui,Roboto,Arial,sans-serif;max-width:760px;margin:0 auto;padding:16px;color:#222}
  .card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0;display:flex;gap:12px;align-items:center}
  .card img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#f5f5f5}
  .muted{color:#666;font-size:.9em}
  button{padding:10px 14px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer;margin:4px 4px 4px 0}
  button.primary{background:#0a7b2e;color:#fff;border-color:#0a7b2e}
  textarea{width:100%;min-height:70px}
  #msg{background:#f6f6f6;padding:10px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Lista Casa Ley compartida</h1>
<p class="muted" id="meta">Pega el link o código <code>#c=...</code> para ver la lista.</p>

<textarea id="input" placeholder="Pega aquí el link compartido o el código #c=..."></textarea><br>
<button id="btnVer">Ver lista</button>
<button id="btnCopiar">Copiar como texto</button>
<button id="btnClonar" class="primary">Clonar en mi carrito (estando en tusuper)</button>
<div id="msg"></div>
<div id="lista"></div>

<script>
// Config — GitHub Pages + futuro backend (ver plan-backend.md)
// NOTA: esta es la copia empaquetada en la extensión. El original está en /viewer.html
// (el que se publica en Pages). Si lo editas, copia el archivo para no duplicar versiones.
var VIEWER_VERSION = 'v1-hash';
var BACKEND_URL = null; // futuro: 'https://xyzcompany.supabase.co' → activará links cortos ?c=ABC123
// Formato v1: {v:1, b:"1086", p:[[ProductId, Quantity, artdesc, special_price, normal_price, unitmeasure, picture_name, GRAMS, total], ...]}
// Encode: base64url(JSON)
function b64urlEncode(obj){
  const json = JSON.stringify(obj);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlDecode(code){
  code = code.trim();
  // acepta URL completa o solo el código
  const m = code.match(/#c=([A-Za-z0-9\-_]+)/);
  if (m) code = m[1];
  code = code.replace(/-/g,'+').replace(/_/g,'/');
  while (code.length % 4) code += '=';
  const bin = atob(code);
  const json = decodeURIComponent(escape(bin));
  return JSON.parse(json);
}
function fmt(n){ return '$' + Number(n||0).toFixed(2); }
var IMG_BASE = 'https://serviciosapp.casaley.com.mx/rails/';
function unitPrice(r){ var s=Number(r[3]); return (r[3]!=null && !isNaN(s) && s>0) ? r[3] : r[4]; }
function hasOffer(r){ var s=Number(r[3]), n=Number(r[4]); return r[3]!=null && !isNaN(s) && s>0 && s!==n; }
function qtyText(r){ var qty=r[1], unit=r[5]||'PZ', grams=r[7];
  if(unit==='KG') return qty+' g'+((grams && Number(grams)!==Number(qty))?' (paq. de '+grams+' g)':'');
  return qty+(Number(qty)===1?' pza':' pzas'); }
function storeName(share){ return share.n || ''; }
function imgUrl(img){ if(!img) return null; if(/^https?:/i.test(img)) return img;
  return IMG_BASE+String(img).replace(/\\/g,'/').replace(/^\//,''); }

function render(share){
  const meta = document.getElementById('meta');
  const lista = document.getElementById('lista');
  const msg = document.getElementById('msg');
  lista.innerHTML = ''; msg.textContent = '';
  if (!share || share.v !== 1 || !Array.isArray(share.p)){
    msg.textContent = 'Código inválido (se esperaba v1 con p=productos).';
    return;
  }
  meta.textContent = share.p.length + (share.p.length===1?' producto':' productos') + (share.by?' · Creada por '+share.by:'') + (storeName(share)?' · '+storeName(share):'') + ' · Precios de referencia, pueden variar en tienda.';
  let total = 0;
  share.p.forEach(function(r){
    const desc=r[2], special=r[3], normal=r[4], img=r[6], line=r[8];
    total += Number(line || 0);
    const div = document.createElement('div');
    div.className = 'card';
    let imgHtml = '';
    const src = imgUrl(img);
    if (src) imgHtml = '<img src="'+src+'" onerror="this.style.display=\'none\'" alt="">';
    const cantTxt = qtyText(r);
    const priceHtml = hasOffer(r)
      ? '<b>'+fmt(line)+'</b> <span style="color:#0a7b2e">Oferta '+fmt(special)+' c/u (antes '+fmt(normal)+')</span>'
      : '<b>'+fmt(line)+'</b> <span class="muted">'+fmt(unitPrice(r))+' c/u</span>';
    div.innerHTML = imgHtml + '<div><b>'+desc+'</b><br><span class="muted">'+cantTxt+'</span><br>'+priceHtml+'</div>';
    lista.appendChild(div);
  });
  const t = document.createElement('h2');
  t.textContent = 'Total aproximado: ' + fmt(total);
  lista.appendChild(t);
  const note = document.createElement('p');
  note.className = 'muted';
  note.textContent = 'Puede variar en tienda.';
  lista.appendChild(note);
  window._share = share;
}

document.getElementById('btnVer').onclick = function(){
  try { render(b64urlDecode(document.getElementById('input').value)); }
  catch(e){ document.getElementById('msg').textContent = 'No pude decodificar: ' + e.message; }
};
document.getElementById('btnCopiar').onclick = function(){
  const s = window._share; if(!s){ return; }
  const lines = s.p.map(function(r){ return '- ' + r[2] + ' (' + qtyText(r) + ') ' + fmt(r[8]); });
  const head = s.by ? ('Lista de ' + s.by + ' · Casa Ley') : 'Mi lista Casa Ley';
  const txt = head + (storeName(s)?' ('+storeName(s)+')':'') + ':\n' + lines.join('\n');
  const msg = document.getElementById('msg');
  function done(t){ msg.textContent = t; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){ done('Copiado para WhatsApp.'); }, function(){
      const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done('Copiado para WhatsApp (fallback).'); } catch(e){ done('Copia manual: ' + txt); }
      ta.remove();
    });
  } else done('Copia manual: ' + txt);
};
// Clonar solo funciona abierto desde tusuper.casaley.com.mx (usa TU sesión local, nunca la del link)
document.getElementById('btnClonar').onclick = async function(){
  const msg = document.getElementById('msg');
  const s = window._share;
  if (!s){ msg.textContent = 'Primero pulsa Ver lista.'; return; }
  if (!location.hostname.includes('casaley')) {
    msg.textContent = 'Esta página solo muestra la lista. Para pasarla a tu carrito, usa la extensión estando en tusuper.casaley.com.mx.';
    return;
  }
  try {
    msg.textContent = 'Clonando ' + s.p.length + ' productos con tu sesión...';
    const r = await window.leyImportar(s);
    msg.textContent = 'Listo. Total backend: $' + r.total + '. Recarga el carrito para verlo.';
  } catch(e){ msg.textContent = 'Error al clonar: ' + e.message; }
};
// autocarga si viene #c= en la URL (GitHub Pages: .../viewer.html#c=...)
// Gancho backend: si viene ?c=CODIGO_CORTO y BACKEND_URL está configurado, se buscará allá (ver plan-backend.md fase v2)
(function(){
  var qs = new URLSearchParams(location.search);
  var short = qs.get('c');
  if (short && BACKEND_URL) {
    document.getElementById('msg').textContent = 'Buscando código ' + short + ' en backend...';
    fetch(BACKEND_URL + '/rest/v1/lists?code=eq.' + encodeURIComponent(short) + '&select=*,items(*)')
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(rows){
        if (!rows || !rows.length) throw new Error('código no encontrado');
        render(rows[0].share);
      })
      .catch(function(e){ document.getElementById('msg').textContent = 'Backend: ' + e.message; });
    return;
  }
  if (short && !BACKEND_URL) {
    // ?c=<base64largo> también se acepta (algunos navegadores cortan el # al compartir)
    try { document.getElementById('input').value = '#c=' + short; render(b64urlDecode(short)); return; }
    catch(e){}
  }
  if (location.hash.includes('#c=') || location.hash.match(/^[#]?[A-Za-z0-9\-_]{20,}/)) {
    let h = location.hash.replace(/^#/,'');
    if (!h.startsWith('c=')) h = 'c=' + h;
    document.getElementById('input').value = '#' + h;
    try { render(b64urlDecode('#' + h)); }
    catch(e){ document.getElementById('msg').textContent = 'El link trae un código que no pude leer (' + e.message + '). Pega el link completo abajo y pulsa Ver lista.'; }
  }
})();
</script>
</body>
</html>
