<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body {
    width: 340px;
    font-family: system-ui, Roboto, Arial, sans-serif;
    margin: 0;
    padding: 14px;
    color: #f2f4f6;
    background: #121417;
  }
  h3 { margin: 0 0 4px; font-size: 15px; }
  .sub { color: #a7b0ba; font-size: 12px; margin: 0 0 10px; }
  .summary {
    background: #1b1e23;
    border: 1px solid #2b3138;
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .summary b { font-size: 15px; }
  button {
    width: 100%;
    padding: 11px;
    margin: 4px 0;
    border-radius: 12px;
    border: 1px solid #2b3138;
    background: #1b1e23;
    color: #f2f4f6;
    cursor: pointer;
    font-size: 14px;
    min-height: 44px;
  }
  button.primary { background: #35b558; border-color: #35b558; color: #06130a; font-weight: 700; }
  button:disabled { opacity: 0.5; cursor: wait; }
  textarea, input {
    width: 100%;
    box-sizing: border-box;
    min-height: 52px;
    margin-top: 6px;
    font-size: 12px;
    font-family: inherit;
    color: #f2f4f6;
    background: #1b1e23;
    border: 1px solid #2b3138;
    border-radius: 10px;
    padding: 8px;
  }
  #status {
    background: #1b1e23;
    border-radius: 10px;
    padding: 8px 10px;
    margin-top: 8px;
    font-size: 13px;
    white-space: pre-wrap;
  }
  #status.err { background: #4a1713; }
  #status.ok { background: #12351f; }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    font-size: 11px;
    color: #a7b0ba;
  }
  .foot button {
    width: auto;
    min-height: 0;
    padding: 6px 10px;
    font-size: 12px;
    margin: 0;
  }
  details { margin: 6px 0; font-size: 13px; color: #a7b0ba; }
  details input { margin-top: 6px; }
</style>
</head>
<body>
<h3>Mi lista Casa Ley</h3>
<p class="sub" id="summary">Leyendo carrito…</p>
<p class="sub" id="personal">Sin lista personal todavía.</p>
<button id="btnPersonal" class="primary">Crear mi lista personal</button>
<button id="btnMyLink">Copiar mi link</button>
<button id="btnSyncNow">Sincronizar ahora</button>
<button id="btnAuto">Activar auto</button>
<button id="btnOpen">Abrir mi carrito en página</button>
<button id="btnCopy">Copiar link para compartir</button>
<textarea id="importInput" placeholder="Pegar link para clonar aquí"></textarea>
<button id="btnClone">Clonar lista en este carrito</button>
<details>
  <summary>Usar otro código como mío</summary>
  <input id="updCode" placeholder="Link ?c= de tu foto" />
  <input id="updKey" type="password" placeholder="Clave de edición" autocomplete="off" />
  <button id="btnAdopt">Adoptar</button>
</details>
<button id="btnAuto">Activar auto-actualizar</button>
<div id="status">Listo.</div>
<div class="foot">
  <span id="ver">v…</span>
  <button id="btnHist" title="Ver historial en la página">Historial</button>
</div>
<script src="popup.js"></script>
</body>
</html>
